name: CES International
description: 'CES International was a software company founded in 1989 and based in Alpharetta, Georgia,
  that built real-time software solutions for distribution utilities — including the Centricity operations
  resource management (ORM) system with outage-management capabilities and an energy delivery management
  (EDM) suite for network operations — serving utilities on five continents and more than 35 million metered
  accounts. It was acquired by SPL WorldGroup in May 2004, and SPL WorldGroup was in turn acquired by Oracle
  in November 2006, where its utilities software became the foundation of the Oracle Utilities global business
  unit. CES International no longer operates as an independent company: it publishes no developer portal,
  no documentation, and no API surface, and none of its historical domains resolve to a live company site.
  This record is retained as a historical / defunct entry in the API Evangelist network.'
